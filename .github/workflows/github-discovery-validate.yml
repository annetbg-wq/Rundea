name: github-discovery-validate

on:
  push:
    branches: [feat/github-source-discovery]

permissions:
  contents: write

jobs:
  validate-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Register GitHub discovery route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/index.ts')
          s = p.read_text()
          anchor = 'import { registerSourceBrokerRoutes, issueSourceBundleTicket, validateSourceDelivery } from "./source-broker";\n'
          import_line = 'import { registerGitHubSourceDiscoveryRoutes } from "./github-source-discovery-routes";\n'
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + import_line, 1)
          route_anchor = 'registerSourceBrokerRoutes(app, pool);\n'
          route_line = 'registerGitHubSourceDiscoveryRoutes(app, pool, requireControl);\n'
          if route_line not in s:
              if route_anchor not in s:
                  raise SystemExit('route anchor missing')
              s = s.replace(route_anchor, route_anchor + route_line, 1)
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified wiring
        run: |
          if git diff --quiet -- apps/api/src/index.ts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/index.ts
          git commit -m 'feat(github): register source discovery route'
          git push origin HEAD:feat/github-source-discovery
