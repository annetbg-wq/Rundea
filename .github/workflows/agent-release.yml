name: agent-release

on:
  workflow_run:
    workflows: ["ci", "node-acceptance"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: agent-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/agent/go.sum
      - name: Resolve Agent release candidate
        id: candidate
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "should_release=false" >> "${GITHUB_OUTPUT}"
          if git diff --quiet "${RELEASE_SHA}^" "${RELEASE_SHA}" -- apps/agent/VERSION; then
            echo "The exact main commit did not change apps/agent/VERSION; no Agent release is due."
            exit 0
          fi
          version="$(tr -d '\r\n' < apps/agent/VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "apps/agent/VERSION must contain an exact X.Y.Z version" >&2
            exit 1
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=agent-v${version}" >> "${GITHUB_OUTPUT}"
          echo "should_release=true" >> "${GITHUB_OUTPUT}"
      - name: Require both post-merge main gates on the exact SHA
        id: gates
        if: steps.candidate.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "${GITHUB_OUTPUT}"
          for workflow in ci.yml node-acceptance.yml; do
            state="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${workflow}" \
              --commit "${RELEASE_SHA}" \
              --event push \
              --limit 10 \
              --json status,conclusion,headSha \
              --jq '.[0] | "\(.status) \(.conclusion) \(.headSha)"')"
            if [[ "${state}" != "completed success ${RELEASE_SHA}" ]]; then
              echo "Gate ${workflow} is not yet successful for ${RELEASE_SHA}: ${state:-missing}" >&2
              echo "A later workflow_run completion for this SHA will evaluate the pair again."
              exit 0
            fi
          done
          echo "ready=true" >> "${GITHUB_OUTPUT}"
      - name: Guard immutable tag and release identity
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            existing_sha="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing_sha}" != "${RELEASE_SHA}" ]]; then
              echo "${TAG} already points to ${existing_sha}; refusing to move an immutable Agent tag to ${RELEASE_SHA}" >&2
              exit 1
            fi
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; it will be verified but never overwritten."
          fi
      - name: Build static Linux Agent binaries
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        working-directory: apps/agent
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist/agent
          ldflags="-s -w -X main.agentBuildSHA=${RELEASE_SHA}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${ldflags}" -o ../../dist/agent/rundea-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${ldflags}" -o ../../dist/agent/rundea-agent-linux-arm64 .
          identity="$(../../dist/agent/rundea-agent-linux-amd64 --identity)"
          [[ "${identity}" == *"\"buildSha\":\"${RELEASE_SHA}\""* ]] || {
            echo "Built Agent does not report the immutable release SHA" >&2
            exit 1
          }
          for capability in buildArgs managedIngress runtimeMetrics; do
            ../../dist/agent/rundea-agent-linux-amd64 "--require-capability=${capability}"
          done
      - name: Generate and verify SHA256SUMS
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        working-directory: dist/agent
        shell: bash
        run: |
          set -euo pipefail
          sha256sum rundea-agent-linux-amd64 rundea-agent-linux-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload audit bundle
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rundea-agent-${{ steps.candidate.outputs.tag }}-${{ github.event.workflow_run.head_sha }}
          path: |
            dist/agent/rundea-agent-linux-amd64
            dist/agent/rundea-agent-linux-arm64
            dist/agent/SHA256SUMS
          if-no-files-found: error
      - name: Create immutable tag at exact merge SHA
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            [[ "$(git rev-list -n 1 "${TAG}")" == "${RELEASE_SHA}" ]]
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${RELEASE_SHA}" -m "Rundea Agent ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish immutable private GitHub Release assets
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; immutable release assets will not be replaced."
            exit 0
          fi
          gh release create "${TAG}" \
            dist/agent/rundea-agent-linux-amd64 \
            dist/agent/rundea-agent-linux-arm64 \
            dist/agent/SHA256SUMS \
            --verify-tag \
            --title "Rundea Agent ${TAG}" \
            --notes "Static Linux Agent binaries for Rundea nodes, built from ${RELEASE_SHA}. Download through the authenticated Rundea Control Plane bootstrap path; verify against SHA256SUMS."
      - name: Verify published release assets
        if: steps.candidate.outputs.should_release == 'true' && steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          rm -rf dist/published-agent
          mkdir -p dist/published-agent
          gh release download "${TAG}" \
            --dir dist/published-agent \
            --pattern 'rundea-agent-linux-amd64' \
            --pattern 'rundea-agent-linux-arm64' \
            --pattern 'SHA256SUMS'
          cd dist/published-agent
          test -f rundea-agent-linux-amd64
          test -f rundea-agent-linux-arm64
          test -f SHA256SUMS
          sha256sum --check SHA256SUMS
          identity="$(./rundea-agent-linux-amd64 --identity)"
          [[ "${identity}" == *"\"buildSha\":\"${RELEASE_SHA}\""* ]] || {
            echo "Published Agent identity does not match release SHA" >&2
            exit 1
          }
