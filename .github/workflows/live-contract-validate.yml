name: live-contract-validate

on:
  push:
    branches: [feat/live-environment-contract]

permissions:
  contents: write

jobs:
  validate-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Wire validated live environment into API startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/index.ts')
          s = p.read_text()
          anchor = 'import { assertTransition } from "@rundea/deployer";\n'
          import_line = 'import { resolveLiveEnvironment } from "./live-environment";\n'
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + import_line, 1)
          old_config = 'const masterKey = parseMasterKey(masterKeyEncoded);\nconst mcpHttpConfig = resolveReadonlyMcpHttpConfig(process.env, controlToken);'
          new_config = 'const masterKey = parseMasterKey(masterKeyEncoded);\nconst liveEnvironment = resolveLiveEnvironment(process.env);\nconst mcpHttpConfig = resolveReadonlyMcpHttpConfig(process.env, controlToken);'
          if old_config in s:
              s = s.replace(old_config, new_config, 1)
          elif 'const liveEnvironment = resolveLiveEnvironment(process.env);' not in s:
              raise SystemExit('config anchor missing')
          old_cors = 'await app.register(cors, { origin: process.env.RUNDEA_WEB_ORIGIN ?? "http://localhost:5173" });'
          new_cors = 'await app.register(cors, { origin: liveEnvironment.webOrigin });'
          if old_cors in s:
              s = s.replace(old_cors, new_cors, 1)
          elif new_cors not in s:
              raise SystemExit('CORS anchor missing')
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified startup wiring
        run: |
          if git diff --quiet -- apps/api/src/index.ts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/index.ts
          git commit -m 'feat(live): enforce live environment contract at startup'
          git push origin HEAD:feat/live-environment-contract
