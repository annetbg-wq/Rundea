name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @rundea/web

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Agent release version
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "apps/agent/VERSION must contain an exact X.Y.Z version" >&2
            exit 1
          }
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if git diff --quiet "${PR_BASE_SHA}" "${GITHUB_SHA}" -- ':(top)apps/agent/VERSION'; then
              echo "Agent VERSION is unchanged in this PR; existing release tag is expected."
            else
              git fetch --tags --force
              if git show-ref --verify --quiet "refs/tags/agent-v${version}"; then
                echo "agent-v${version} already exists; bump apps/agent/VERSION before merging Agent release changes" >&2
                exit 1
              fi
            fi
          fi
      - name: Validate installer shell syntax
        working-directory: ${{ github.workspace }}
        run: bash -n infra/agent/install.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/agent/go.sum
      - run: go mod download
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
