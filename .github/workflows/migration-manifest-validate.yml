name: migration-manifest-validate

on:
  push:
    branches: [fix/migration-manifest]

permissions:
  contents: write

jobs:
  validate-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Wire canonical migration manifest into Control Plane startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/index.ts')
          s = p.read_text()
          import_line = 'import { migrationFiles } from "./migration-manifest";\n'
          anchor = 'import { assertTransition } from "@rundea/deployer";\n'
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('index import anchor not found')
              s = s.replace(anchor, anchor + import_line, 1)
          old = '''for (const migration of [
            "001_init.sql",
            "002_service_variables_and_auto_build.sql",
            "003_node_qualification.sql",
            "004_service_domains.sql",
            "005_runtime_controls.sql",
            "007_source_broker.sql",
            "008_runtime_metrics.sql",
            "009_operation_audit.sql",
            "010_operation_approvals.sql",
            "011_operation_audit_approval_hash.sql",
          ]) {'''
          if old in s:
              s = s.replace(old, 'for (const migration of migrationFiles) {', 1)
          elif 'for (const migration of migrationFiles) {' not in s:
              raise SystemExit('migration loop anchor not found')
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified wiring if needed
        run: |
          if git diff --quiet -- apps/api/src/index.ts; then
            echo 'Migration manifest wiring already present.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/index.ts
          git commit -m 'fix(db): execute canonical migration manifest'
          git push origin HEAD:fix/migration-manifest
