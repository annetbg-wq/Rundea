name: node-acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/agent/go.sum
      - name: Build Linux agent bundles
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../../dist/rundea-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../../dist/rundea-agent-linux-arm64 .
          cd ../../dist
          sha256sum rundea-agent-linux-amd64 rundea-agent-linux-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rundea-agent-linux
          path: |
            dist/rundea-agent-linux-amd64
            dist/rundea-agent-linux-arm64
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  node-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rundea
          POSTGRES_PASSWORD: rundea
          POSTGRES_DB: rundea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rundea -d rundea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/agent/go.sum
      - run: npm ci --ignore-scripts
      - name: Build acceptance Agent
        working-directory: apps/agent
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o /tmp/rundea-agent .
          mkdir -p /tmp/rundea-agent-release
          cp /tmp/rundea-agent /tmp/rundea-agent-release/rundea-agent-linux-amd64
          cp /tmp/rundea-agent /tmp/rundea-agent-release/rundea-agent-linux-arm64
          cp VERSION /tmp/rundea-agent-release/VERSION
      - name: Start Control Plane
        env:
          DATABASE_URL: postgres://rundea:rundea@127.0.0.1:5432/rundea
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          RUNDEA_GITHUB_WEBHOOK_SECRET: acceptance-github-webhook-secret
          RUNDEA_WEB_ORIGIN: http://127.0.0.1:5173
          RUNDEA_TEST_AGENT_AUTH_DELAY_MS: '750'
          RUNDEA_AGENT_BUNDLE_DIR: /tmp/rundea-agent-release
          PORT: '4000'
        run: |
          set -euo pipefail
          npm run start -w @rundea/api > /tmp/rundea-api.log 2>&1 &
          echo $! > /tmp/rundea-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/rundea-api.pid)" 2>/dev/null; then
              cat /tmp/rundea-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/rundea-api.log
          echo 'Control Plane did not become healthy' >&2
          exit 1
      - name: Prove one-time bootstrap rotates into permanent node credential
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
        run: node infra/acceptance/node-bootstrap-e2e.mjs
      - name: Prove Foundation isolation, capability admission, port reservation and node selection
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_ACCEPTANCE_DATABASE_URL: postgres://rundea:rundea@127.0.0.1:5432/rundea
        run: node infra/acceptance/foundation-gate-e2e.mjs
      - name: Run Control Plane → Agent → Docker acceptance
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_GITHUB_WEBHOOK_SECRET: acceptance-github-webhook-secret
          RUNDEA_ACCEPTANCE_FIXTURE_REF: 039c34770852fb07cef7f9f0f8534c5de408b207
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
          RUNDEA_ACCEPTANCE_HOST_PORT: '18081'
          RUNDEA_METRICS_INTERVAL: '2s'
        run: node infra/acceptance/node-e2e.mjs
      - name: Prove failed backend keeps previous stable route live
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
          RUNDEA_SAFE_PROMOTION_HOST_PORT: '18082'
        run: node infra/acceptance/safe-promotion-e2e.mjs
      - name: Prove committed route survives Agent crash and reconciles
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
          RUNDEA_RECOVERY_HOST_PORT: '18083'
        run: node infra/acceptance/runtime-router-recovery-e2e.mjs
      - name: Prove Agent → Control Plane → PostgreSQL runtime metrics
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
        run: node infra/acceptance/assert-runtime-metrics.mjs
      - name: Prove READY → DOWN → bounded auto-restart → HEALTHY
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
          RUNDEA_HEALTH_HOST_PORT: '18084'
        run: node infra/acceptance/continuous-health-e2e.mjs
      - name: Prove persistent volume survives redeploy → restart → rollback
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
        run: node infra/acceptance/persistent-volume-e2e.mjs
      - name: Prove project network discovery and cross-project isolation
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
        run: node infra/acceptance/private-network-e2e.mjs
      - name: Prove managed Redis isolation and durability
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
        run: node infra/acceptance/managed-redis-e2e.mjs
      - name: Prove encrypted Control Plane backup and clean-environment DR restore
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          RUNDEA_GITHUB_WEBHOOK_SECRET: acceptance-github-webhook-secret
        run: node infra/acceptance/control-plane-dr-e2e.mjs
      - name: Prove one-time credentials and persisted log redaction
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_ACCEPTANCE_FIXTURE_SHA: 039c34770852fb07cef7f9f0f8534c5de408b207
        run: node infra/acceptance/security-boundary-e2e.mjs
      - name: Prove product-level Agent update and node cleanup
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_AGENT_BINARY: /tmp/rundea-agent
        run: node infra/acceptance/node-maintenance-e2e.mjs
      - name: Control Plane log
        if: always()
        run: cat /tmp/rundea-api.log || true
      - name: Stop Control Plane
        if: always()
        run: |
          if [[ -f /tmp/rundea-api.pid ]]; then
            kill "$(cat /tmp/rundea-api.pid)" 2>/dev/null || true
          fi


  clean-host-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rundea
          POSTGRES_PASSWORD: rundea
          POSTGRES_DB: rundea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rundea -d rundea"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/agent/go.sum
      - run: npm ci --ignore-scripts
      - name: Assert fresh systemd host
        run: |
          set -euo pipefail
          test -d /run/systemd/system
          systemctl is-system-running --wait >/dev/null 2>&1 || systemctl is-system-running >/dev/null 2>&1 || true
          test ! -e /etc/rundea
          test ! -e /var/lib/rundea
          test ! -e /etc/systemd/system/rundea-agent.service
          test ! -e /usr/local/bin/rundea-agent
          docker info >/dev/null
      - name: Build pinned Agent bundle
        working-directory: apps/agent
        run: |
          set -euo pipefail
          mkdir -p /tmp/rundea-agent-release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/rundea-agent-release/rundea-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/rundea-agent-release/rundea-agent-linux-arm64 .
          cp VERSION /tmp/rundea-agent-release/VERSION
      - name: Create trusted local HTTPS origin
        run: |
          set -euo pipefail
          mkdir -p /tmp/rundea-tls
          openssl genrsa -out /tmp/rundea-tls/ca.key 2048
          openssl req -x509 -new -nodes -key /tmp/rundea-tls/ca.key -sha256 -days 1 \
            -subj '/CN=Rundea Acceptance CA' -out /tmp/rundea-tls/ca.crt
          openssl genrsa -out /tmp/rundea-tls/server.key 2048
          openssl req -new -key /tmp/rundea-tls/server.key -subj '/CN=rundea.local' -out /tmp/rundea-tls/server.csr
          cat >/tmp/rundea-tls/server.ext <<'EOF'
          subjectAltName=DNS:rundea.local
          extendedKeyUsage=serverAuth
          keyUsage=digitalSignature,keyEncipherment
          EOF
          openssl x509 -req -in /tmp/rundea-tls/server.csr \
            -CA /tmp/rundea-tls/ca.crt -CAkey /tmp/rundea-tls/ca.key -CAcreateserial \
            -out /tmp/rundea-tls/server.crt -days 1 -sha256 -extfile /tmp/rundea-tls/server.ext
          sudo cp /tmp/rundea-tls/ca.crt /usr/local/share/ca-certificates/rundea-acceptance.crt
          sudo update-ca-certificates
          echo '127.0.0.1 rundea.local' | sudo tee -a /etc/hosts >/dev/null
          curl --version
      - name: Start canonical Control Plane
        env:
          DATABASE_URL: postgres://rundea:rundea@127.0.0.1:5432/rundea
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
          RUNDEA_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          RUNDEA_GITHUB_WEBHOOK_SECRET: acceptance-github-webhook-secret
          RUNDEA_WEB_ORIGIN: https://rundea.local:4443
          RUNDEA_PUBLIC_CONTROL_PLANE_URL: https://rundea.local:4443
          RUNDEA_AGENT_BUNDLE_DIR: /tmp/rundea-agent-release
          PORT: '4000'
        run: |
          set -euo pipefail
          npm run start -w @rundea/api > /tmp/rundea-clean-host-api.log 2>&1 &
          echo $! > /tmp/rundea-clean-host-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/rundea-clean-host-api.pid)" 2>/dev/null; then
              cat /tmp/rundea-clean-host-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/rundea-clean-host-api.log
          exit 1
      - name: Run exact one-command installer on fresh systemd host
        env:
          RUNDEA_ACCEPTANCE_API_URL: http://127.0.0.1:4000
          RUNDEA_ACCEPTANCE_HTTPS_ORIGIN: https://rundea.local:4443
          RUNDEA_ACCEPTANCE_TLS_KEY: /tmp/rundea-tls/server.key
          RUNDEA_ACCEPTANCE_TLS_CERT: /tmp/rundea-tls/server.crt
          RUNDEA_CONTROL_TOKEN: acceptance-control-token
        run: npx tsx infra/acceptance/clean-host-onboarding-e2e.ts
      - name: Clean-host Control Plane log
        if: always()
        run: cat /tmp/rundea-clean-host-api.log || true
      - name: Stop clean-host Control Plane
        if: always()
        run: |
          if [[ -f /tmp/rundea-clean-host-api.pid ]]; then
            kill "$(cat /tmp/rundea-clean-host-api.pid)" 2>/dev/null || true
          fi
          sudo rm -f /usr/local/share/ca-certificates/rundea-acceptance.crt
          sudo update-ca-certificates >/dev/null 2>&1 || true
