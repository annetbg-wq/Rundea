name: live-runtime-image

on:
  pull_request:
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/agent/**'
      - 'infra/live/**'
      - '.github/workflows/live-runtime-image.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/agent/**'
      - 'infra/live/**'
      - '.github/workflows/live-runtime-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          build-args: |
            RUNDEA_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rundea-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rundea-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rundea-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rundea-web:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
